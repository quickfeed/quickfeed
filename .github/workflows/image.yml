name: Build image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # Same command as go.yml (upstream)
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests
        run: DOCKER_TESTS=1 go test github.com/quickfeed/quickfeed/...

  # Same steps as vitest.yml (upstream)
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.4.0
          cache: npm
          cache-dependency-path: ./public/package-lock.json
      - name: Install modules
        working-directory: ./public
        run: npm ci
      - name: Run tests
        working-directory: ./public
        run: npm run test:ci

  # Runs only if both test jobs pass. Pushes only on master, not on PRs.
  image:
    needs: [test-go, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/mahdavizeinab/quickfeed:${{ github.sha }}