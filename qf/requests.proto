syntax = "proto3";
package qf;

import "google/protobuf/timestamp.proto";
import "qf/types.proto";
option go_package   = "github.com/quickfeed/quickfeed/qf";
option swift_prefix = "";

// Message types that are used as requests and responses in API calls.

message CourseSubmissions {
    map<uint64, Submissions> submissions = 1;
}

message ReviewRequest {
    uint64 courseID = 1;
    Review review   = 2;
}

message CourseRequest {
    uint64 courseID = 1;
}

message GroupRequest {
    uint64 courseID = 1;
    uint64 userID   = 2;
    uint64 groupID  = 3;
}

message Organization {
    uint64 ScmOrganizationID   = 1;
    string ScmOrganizationName = 2;
}

message EnrollmentRequest {
    oneof FetchMode {
        uint64 courseID = 1;
        uint64 userID   = 2;
    }
    repeated Enrollment.UserStatus statuses = 3;
}

message SubmissionRequest {
    enum SubmissionType {
        ALL   = 0;  // fetch all submissions
        USER  = 1;  // fetch all user submissions
        GROUP = 2;  // fetch all group submissions
    }
    uint64 CourseID     = 1;
    uint64 AssignmentID = 2;  // only used for user and group submissions
    oneof FetchMode {
        uint64 UserID       = 3;  // fetch single user's submissions with build info
        uint64 GroupID      = 4;  // fetch single group's submissions with build info
        uint64 SubmissionID = 5;  // fetch single specific submission with build info
        SubmissionType Type = 6;  // fetch all submissions of given type without build info
    }
}

// used to check whether student/group submission repo is empty
message RepositoryRequest {
    uint64 userID   = 1;
    uint64 groupID  = 2;
    uint64 courseID = 3;
}

message Repositories {
    map<uint32, string> URLs = 1;  // Map key is the Repository.Type
}

message RebuildRequest {
    uint64 courseID     = 1;
    uint64 assignmentID = 2;
    uint64 submissionID = 3;
}

// NotesRequest fetches all internal notes relevant to a target.
// Exactly one of submissionID, groupID, or enrollmentID should be set.
// When submissionID is set, the response also includes notes attached to the
// submission's group and the submitter's enrollment.
message NotesRequest {
    uint64 courseID     = 1;
    uint64 submissionID = 2;
    uint64 groupID      = 3;
    uint64 enrollmentID = 4;
}

message CourseLogRequest {
    uint64 courseID            = 1;
    LogPosition from           = 2;  // default: 1 hour before to
    LogPosition to             = 3;  // default: now, and the stream keeps sending new entries
    string repository          = 4;  // exact match; unset selects every repository
    CourseLogEntry.Level level = 5;  // minimum level to include
    uint32 limit               = 6;  // default 2000, server maximum 5000
    bool newest                = 7;  // over the limit, send the newest entries rather than the oldest
}

message CourseLogEntry {
    enum Level {
        DEBUG = 0;
        INFO  = 1;
        WARN  = 2;
        ERROR = 3;
    }
    google.protobuf.Timestamp time = 1;
    Level level                    = 2;
    string message                 = 3;
    string source                  = 4;  // repository-relative file:line
    string repository              = 5;
    string repositoryType          = 6;
    map<string, string> fields     = 7;  // remaining structured attributes
    bool truncated                 = 8;
    LogCursor cursor               = 9;  // unset for the stream's own gap reports
}

// LogPosition is one end of a log range: a time, or an entry's cursor. A time
// includes entries stamped at it; a cursor leaves out the entry it came from,
// so a range can continue from an entry already shown without repeating it.
message LogPosition {
    oneof position {
        google.protobuf.Timestamp time = 1;
        LogCursor cursor               = 2;
    }
}

// LogCursor is the position just past an entry in a course's log. Unlike a
// timestamp, it follows the order entries were written, and no two entries
// share one. Clients should only send back cursors the server handed out.
message LogCursor {
    google.protobuf.Timestamp date = 1;  // UTC midnight of the date file's day
    uint64 offset                  = 2;  // bytes into that file, just past the entry's newline
}

// CourseLog is one message of a CourseLogStream. The first message holds the
// backlog for the requested interval; each later message holds a single live
// entry, and lists a repository only when that entry introduces a new one.
message CourseLog {
    repeated CourseLogEntry entries = 1;  // in the order written, which may differ slightly from timestamp order
    repeated string repositories    = 2;  // repositories with entries in the selected interval
    bool truncated                  = 3;  // set when entries were cut off by the limit
}

// RepositoryIssues reports the number of content problems found in a repository.
// Details are available in the course log.
message RepositoryIssues {
    uint32 count = 1;
}

message Void {}
