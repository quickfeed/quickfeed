# Changes to the QuickFeed Deployment from ../base for step 2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickfeed
spec:
  template:
    spec:
      initContainers:
        # Wait until the database accepts connections before starting QuickFeed.
        - name: wait-for-postgres
          image: postgres:17.6
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: quickfeed
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: postgres, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: postgres, key: POSTGRES_DB }
            # When set, QuickFeed uses PostgreSQL instead of the SQLite file.
            # Traffic stays inside the cluster network, so TLS is not used here.
            - name: QUICKFEED_DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
